[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-scoring-api"
version = "0.1.0"
description = "API de scoring crédit avec monitoring et déploiement MLOps"
requires-python = ">=3.11"
authors = [
    {name = "Author", email = "author@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.2",
    "pyarrow>=18.0.0",
    "lightgbm>=4.6.0",
    "joblib>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "tqdm>=4.65.0",
    "evidently>=0.4.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
